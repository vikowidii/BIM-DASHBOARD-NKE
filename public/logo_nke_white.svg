<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="100%" height="100%">
  <!-- NKE Geometric Emblem -->
  <g id="nke-symbol">
    <!-- Green Triangle (Left) -->
    <polygon points="10,130 145,10 145,130" fill="#009c3b" />
    
    <!-- Blue Triangle (Center Bottom) -->
    <polygon points="145,10 145,130 280,130" fill="#004de6" />
    
    <!-- Yellow / Gold Triangle (Right Top) -->
    <polygon points="145,10 280,10 280,130" fill="#faa61a" />
  </g>

  <!-- Typography: NUSA KONSTRUKSI ENJINIRING (White text for dark mode) -->
  <g id="nke-text" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#ffffff">
    <!-- NUSA -->
    <text x="310" y="42" font-size="36" letter-spacing="14px">NUSA</text>
    
    <!-- KONSTRUKSI -->
    <text x="310" y="82" font-size="31" letter-spacing="4px" fill="#e2e8f0">KONSTRUKSI</text>
    
    <!-- ENJINIRING -->
    <text x="310" y="122" font-size="31" letter-spacing="5px" fill="#cbd5e1">ENJINIRING</text>
  </g>
</svg>
